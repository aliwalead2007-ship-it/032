# قبس — CI: يبني فقط عند تغيير كود Kotlin/Gradle
name: Build & Sign APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/src/**'          # أي ملف Kotlin
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
      - '.env.example'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" 2>/dev/null || true

      - name: Fix gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.0.0/gradle/wrapper/gradle-wrapper.jar"
          python3 -c "import zipfile; zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar').namelist(); print('wrapper jar OK')"
          chmod +x gradlew

      - name: Inject secrets (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p app
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          {
            echo "SUPABASE_URL=\"${SUPABASE_URL:-https://YOUR_PROJECT_REF.supabase.co}\""
            echo "SUPABASE_ANON_KEY=\"${SUPABASE_ANON_KEY:-your_publishable_or_anon_key}\""
            echo "GEMINI_API_KEY=\"${GEMINI_API_KEY:-your_key}\""
            echo "AZURE_SPEECH_KEY=\"your_key\""
            echo "AZURE_SPEECH_REGION=\"your_region\""
            echo "ELEVENLABS_API_KEY=\"your_key\""
            echo "GROQ_API_KEY=\"your_key\""
            echo "HUGGINGFACE_API_KEY=\"your_key\""
            echo "PEXELS_API_KEY=\"your_key\""
            echo "PIXABAY_API_KEY=\"your_key\""
            echo "QF_CLIENT_ID=\"${QF_CLIENT_ID:-your_key}\""
            echo "QF_CLIENT_SECRET=\"${QF_CLIENT_SECRET:-your_key}\""
          } > .env

      - name: Assemble Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --max-workers=2 \
            --build-cache

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qabas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: On failure — print Kotlin errors hint
        if: failure()
        run: |
          echo "ابحث في اللوج عن: e: file://  أو Unresolved reference"
